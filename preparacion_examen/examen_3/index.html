<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema de facturación</title>
  <style>
    body { font-family: sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    h1 { text-align: center; color: #00579b; }
    h2 { color: #00579b; border-bottom: 1px solid #ddd; padding-bottom: .2rem; }
    .fila { display: flex; gap: 1rem; flex-wrap: wrap; align-items: flex-start; margin-bottom: .8rem; }
    .campo { display: flex; flex-direction: column; flex: 1; min-width: 140px; }
    label { font-weight: bold; font-size: .9rem; }
    .error { color: crimson; font-size: .85rem; min-height: 1.1rem; }
    table { width: 100%; border-collapse: collapse; margin-top: .5rem; }
    th { background: #00579b; color: white; text-align: left; padding: .5rem; }
    td, tfoot th { padding: .5rem; border: 1px solid #ddd; }
    tbody td:nth-child(n+2):nth-child(-n+4) { text-align: right; font-family: monospace; }
    tbody tr:nth-child(even) { background: #f4f4f4; }
    tr.descuento td:first-child { color: seagreen; font-weight: bold; }
    tfoot th { background: #f0f0f0; text-align: left; }
    tfoot td { font-family: monospace; text-align: right; }
    tfoot tr.total th, tfoot tr.total td { background: #dbe5f1; font-size: 1.1rem; }
    button.eliminar { background: #dc3545; color: white; border: 0; border-radius: 50%; width: 1.8rem; height: 1.8rem; cursor: pointer; }
    .sr { position: absolute; left: -9999px; }
    #grupo-tasa { border: 0; background: #f4f4f4; display: flex; gap: 1.2rem; justify-content: center; padding: .6rem; }
  </style>
</head>
<body>
  <h1>Sistema de facturación</h1>

  <h2>Añadir línea</h2>
  <form id="formulario" novalidate>
    <div class="fila">
      <div class="campo">
        <label for="catalogo">Producto del catálogo (opcional)</label>
        <select id="catalogo">
          <option value="">-- Escribir a mano --</option>
        </select>
      </div>
    </div>

    <div class="fila">
      <div class="campo">
        <label for="concepto">Concepto</label>
        <input type="text" id="concepto" name="concepto" required aria-describedby="error-concepto">
        <span class="error" id="error-concepto" aria-live="polite"></span>
      </div>
      <div class="campo">
        <label for="cantidad">Cantidad</label>
        <input type="number" id="cantidad" name="cantidad" min="1" max="99" step="1" value="1" required aria-describedby="error-cantidad">
        <span class="error" id="error-cantidad" aria-live="polite"></span>
      </div>
      <div class="campo">
        <label for="precio">Precio (€)</label>
        <input type="number" id="precio" name="precio" min="0.01" step="0.01" required aria-describedby="error-precio">
        <span class="error" id="error-precio" aria-live="polite"></span>
      </div>
    </div>

    <div class="fila">
      <label><input type="checkbox" id="con-descuento"> Aplicar descuento</label>
      <label for="descuento" class="sr">Porcentaje de descuento</label>
      <select id="descuento" disabled>
        <option value="5">5 %</option>
        <option value="10" selected>10 %</option>
        <option value="15">15 %</option>
        <option value="20">20 %</option>
        <option value="25">25 %</option>
      </select>
    </div>

    <button type="submit">Insertar</button>
    <button type="button" id="vaciar">Vaciar factura</button>
    <p id="mensaje" role="status" aria-live="polite"></p>
  </form>

  <h2>Seleccionar impuestos</h2>
  <fieldset id="grupo-tasa">
    <legend class="sr">Tasa de impuestos</legend>
    <label><input type="radio" name="tasa" value="5"> 5%</label>
    <label><input type="radio" name="tasa" value="10"> 10%</label>
    <label><input type="radio" name="tasa" value="15"> 15%</label>
    <label><input type="radio" name="tasa" value="20" checked> 20%</label>
  </fieldset>

  <h2>Factura</h2>
  <table>
    <thead>
      <tr>
        <th>Concepto</th><th>Cantidad</th><th>Precio unit.</th><th>Precio total</th><th>Eliminar</th>
      </tr>
    </thead>
    <tbody id="lineas"></tbody>
    <tfoot>
      <tr><th colspan="3">Subtotal:</th><td id="subtotal"></td><td></td></tr>
      <tr><th colspan="3">Tasa:</th><td id="tasa-valor"></td><td></td></tr>
      <tr><th colspan="3">Impuestos:</th><td id="impuestos"></td><td></td></tr>
      <tr class="total"><th colspan="3">TOTAL:</th><td id="total"></td><td></td></tr>
    </tfoot>
  </table>

  <script src="productos.js"></script>
  <script src="facturacion.js"></script>
</body>
</html>
