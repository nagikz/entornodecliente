<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suscripción</title>
    <style>
        .error {
            color: rgb(192, 72, 72);
        }
        body{
            background-color: antiquewhite;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            
        }
        h1{
            color: rgb(63, 97, 63);
        }
        form{
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }
        legend{
            color: rgb(59, 77, 59);
        }
        #precio{
            color: rgb(204, 60, 67);
        }
    </style>
</head>
<body>
    <h1>Formulario de Suscripción</h1>
    <form method="post" action="suscribe.php" id="suscripcionForm" novalidate>
        <fieldset>
            <legend>Datos personales</legend>
            <p>
                <label for="nombre">Nombre: </label>
                <input type="text" name="nombre" id="nombre">
                <span class="error"></span>
            </p>
            <p>
                <label for="dni">DNI: </label>
                <input type="text" name="dni" id="dni" placeholder="12345678-A">
                <span class="error"></span>
            </p>
        </fieldset>

        <fieldset id="fsTipo">
            <legend>Tipo de Suscripción</legend>
            <span class="error"></span>
            <input type="radio" name="tipo" id="basico" value="basico" checked>
            <label for="basico">Básico</label>
            <input type="radio" name="tipo" id="estandar" value="estandar">
            <label for="estandar">Estándar</label>
            <input type="radio" name="tipo" id="premium" value="premium">
            <label for="premium">Premium</label>
            <input type="radio" name="tipo" id="elite" value="elite">
            <label for="elite">Élite</label>
        </fieldset>

        <fieldset id="fsTemas">
            <legend>Temas</legend>
            <span class="error"></span>
            <div id="temasContainer"></div>
        </fieldset>

        <p>Precio de la suscripción: <strong id="precio"></strong></p>

        <p>
            <input type="reset" value="Borrar">
            <input type="submit" value="Suscribir">
        </p>
    </form>

    <script src="temas.js"></script>
    <script src="suscripcion.js"></script>
</body>
</html>
